name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/squareone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Apply migrations and synthetic seed
        run: scripts/db-local.sh apply
      - name: Generated types are up to date
        run: pnpm db:types && git diff --exit-code src/lib/database.types.ts
      - name: SQL tests (constraints and RLS denied cases)
        run: pnpm db:test
      - name: Unit and parity tests
        run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start local Supabase (Auth, PostgREST, Storage, Postgres)
        run: scripts/supabase-local.sh start
      - name: SQL tests against Supabase Postgres
        run: |
          set -a; . ./.env.supabase-local; set +a
          DATABASE_URL="$SUPABASE_DB_URL" pnpm db:test
      - name: Build
        run: |
          set -a; . ./.env.supabase-local; set +a
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance tests with real logins
        run: pnpm test:e2e
