# Supabase CLI configuration for local development (`supabase start`, `supabase db reset`).
# Hosted projects are configured in the Supabase dashboard; mirror these auth settings there.
project_id = "squareone-elc-compliance"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]   # synthetic data only

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Invite-only: public sign-up is off (BUILD.md section 4).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
file_size_limit = "20MiB"
